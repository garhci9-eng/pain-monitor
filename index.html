<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무의식 환자 통증 모니터링 시스템</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0a0f1a;
    --surface: #111827;
    --surface2: #1a2234;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #ff6b6b;
    --accent3: #ffd166;
    --accent4: #06d6a0;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --pain-low: #06d6a0;
    --pain-mid: #ffd166;
    --pain-high: #ff6b6b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255,107,107,0.04) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  .container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }

  .header-left h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .header-left h1 span { color: var(--accent); }
  .header-left p { font-size: 12px; color: var(--text-dim); margin-top: 4px; font-family: 'DM Mono', monospace; }

  .live-badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3);
    padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-family: 'DM Mono', monospace; color: var(--accent2);
  }

  .live-dot { width: 6px; height: 6px; background: var(--accent2); border-radius: 50%; animation: pulse 1.5s infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }

  .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }

  .card-title { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 16px; }

  .vital-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .vital-item label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }

  .vital-item input, .vital-item select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 14px; outline: none; transition: border-color 0.2s;
  }

  .vital-item input:focus, .vital-item select:focus { border-color: var(--accent); }
  .vital-item select option { background: var(--surface2); }

  .pain-display { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; }

  .pain-number { font-family: 'DM Mono', monospace; font-size: 72px; font-weight: 500; line-height: 1; transition: color 0.5s; }

  .pain-label { font-size: 13px; color: var(--text-dim); }

  .pain-bar-container { width: 100%; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }

  .pain-bar { height: 100%; border-radius: 4px; transition: width 0.8s ease, background 0.5s; width: 0%; }

  .pain-indicators { display: flex; justify-content: space-between; width: 100%; font-size: 10px; font-family: 'DM Mono', monospace; color: var(--text-dim); }

  .analyze-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent), #0099bb);
    border: none; border-radius: 10px; color: #000;
    font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 16px;
  }

  .analyze-btn:hover { opacity: 0.9; }
  .analyze-btn:active { transform: scale(0.99); }
  .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; display: none; }
  .result-card.visible { display: block; animation: fadeIn 0.4s ease; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }

  .alert-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-family: 'DM Mono', monospace; font-weight: 500; }

  .alert-low { background: rgba(6,214,160,0.15); color: var(--pain-low); border: 1px solid rgba(6,214,160,0.3); }
  .alert-mid { background: rgba(255,209,102,0.15); color: var(--pain-mid); border: 1px solid rgba(255,209,102,0.3); }
  .alert-high { background: rgba(255,107,107,0.15); color: var(--accent2); border: 1px solid rgba(255,107,107,0.3); }

  .result-content { font-size: 14px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }

  .timestamp { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); }

  .loading { display: none; align-items: center; gap: 10px; color: var(--text-dim); font-size: 13px; padding: 20px 0; justify-content: center; }
  .loading.visible { display: flex; }

  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .history-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }

  .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }

  .history-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--surface2); border-radius: 8px; font-size: 12px; font-family: 'DM Mono', monospace; }

  .empty-history { color: var(--text-dim); font-size: 12px; text-align: center; padding: 20px; font-family: 'DM Mono', monospace; }

  @media (max-width: 700px) {
    .main-grid { grid-template-columns: 1fr; }
    .vital-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-left">
      <h1>무의식 환자 <span>통증 모니터링</span></h1>
      <p>AI-POWERED PAIN ASSESSMENT SYSTEM v1.0</p>
    </div>
    <div class="live-badge">
      <div class="live-dot"></div>
      MONITORING
    </div>
  </header>

  <div class="main-grid">
    <div class="card">
      <div class="card-title">바이탈 사인 입력</div>
      <div class="vital-grid">
        <div class="vital-item">
          <label>맥박 (회/분)</label>
          <input type="number" id="heartRate" placeholder="72">
        </div>
        <div class="vital-item">
          <label>혈압 수축기 (mmHg)</label>
          <input type="number" id="systolic" placeholder="120">
        </div>
        <div class="vital-item">
          <label>혈압 이완기 (mmHg)</label>
          <input type="number" id="diastolic" placeholder="80">
        </div>
        <div class="vital-item">
          <label>호흡수 (회/분)</label>
          <input type="number" id="respRate" placeholder="16">
        </div>
        <div class="vital-item">
          <label>산소포화도 (%)</label>
          <input type="number" id="spo2" placeholder="98">
        </div>
        <div class="vital-item">
          <label>체온 (°C)</label>
          <input type="number" id="temp" placeholder="36.5" step="0.1">
        </div>
        <div class="vital-item">
          <label>발한 (땀)</label>
          <select id="sweating">
            <option value="없음">없음</option>
            <option value="경미">경미</option>
            <option value="심함">심함</option>
          </select>
        </div>
        <div class="vital-item">
          <label>얼굴 근육 긴장</label>
          <select id="facialTension">
            <option value="이완">이완</option>
            <option value="경미한 긴장">경미한 긴장</option>
            <option value="심한 긴장">심한 긴장</option>
          </select>
        </div>
      </div>
      <button class="analyze-btn" onclick="analyzePain()">AI 통증 분석 시작</button>
    </div>

    <div class="card">
      <div class="card-title">추정 통증 수치</div>
      <div class="pain-display">
        <div class="pain-number" id="painNumber" style="color: var(--text-dim)">-</div>
        <div class="pain-label" id="painLabel">바이탈 입력 후 분석하세요</div>
        <div style="width:100%">
          <div class="pain-bar-container">
            <div class="pain-bar" id="painBar"></div>
          </div>
          <div class="pain-indicators">
            <span>0 무통증</span>
            <span>5 중등도</span>
            <span>10 극심</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    AI가 바이탈 데이터를 분석하고 있습니다...
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:13px; font-weight:600;">의료진 치료 계획</span>
        <span class="alert-badge" id="alertBadge"></span>
      </div>
      <span class="timestamp" id="resultTime"></span>
    </div>
    <div class="result-content" id="resultContent"></div>
  </div>

  <div class="history-card">
    <div class="card-title" style="margin-bottom:12px;">분석 기록</div>
    <div class="history-list" id="historyList">
      <div class="empty-history">아직 분석 기록이 없습니다</div>
    </div>
  </div>

</div>

<script>
async function analyzePain() {
  const vitals = {
    heartRate: document.getElementById('heartRate').value,
    systolic: document.getElementById('systolic').value,
    diastolic: document.getElementById('diastolic').value,
    respRate: document.getElementById('respRate').value,
    spo2: document.getElementById('spo2').value,
    temp: document.getElementById('temp').value,
    sweating: document.getElementById('sweating').value,
    facialTension: document.getElementById('facialTension').value,
  };

  if (!vitals.heartRate || !vitals.systolic) {
    alert('맥박과 혈압은 필수입니다.');
    return;
  }

  const btn = document.querySelector('.analyze-btn');
  btn.disabled = true;
  document.getElementById('loading').classList.add('visible');
  document.getElementById('resultCard').classList.remove('visible');

  try {
    const response = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(vitals)
    });

    const result = await response.json();
    if (result.error) throw new Error(result.error);

    updatePainDisplay(result.painScore);
    showResult(result);
    addHistory(result, vitals);

  } catch (err) {
    alert('분석 중 오류가 발생했습니다: ' + err.message);
  } finally {
    btn.disabled = false;
    document.getElementById('loading').classList.remove('visible');
  }
}

function updatePainDisplay(score) {
  const numEl = document.getElementById('painNumber');
  const labelEl = document.getElementById('painLabel');
  const barEl = document.getElementById('painBar');

  numEl.textContent = score;

  let color, label;
  if (score <= 3) { color = 'var(--pain-low)'; label = '경미한 통증 또는 무통증'; }
  else if (score <= 6) { color = 'var(--pain-mid)'; label = '중등도 통증'; }
  else { color = 'var(--pain-high)'; label = '심한 통증 — 즉각 조치 필요'; }

  numEl.style.color = color;
  labelEl.textContent = label;
  barEl.style.width = (score * 10) + '%';
  barEl.style.background = color;
}

function showResult(result) {
  const card = document.getElementById('resultCard');
  const badge = document.getElementById('alertBadge');
  const content = document.getElementById('resultContent');
  const time = document.getElementById('resultTime');

  badge.className = 'alert-badge';
  if (result.urgency === '긴급' || result.urgency === '높음') {
    badge.classList.add('alert-high');
    badge.textContent = '⚠ ' + result.urgency;
  } else if (result.urgency === '중간') {
    badge.classList.add('alert-mid');
    badge.textContent = '◆ ' + result.urgency;
  } else {
    badge.classList.add('alert-low');
    badge.textContent = '✓ ' + result.urgency;
  }

  time.textContent = new Date().toLocaleTimeString('ko-KR');
  content.textContent = `📊 통증 평가\n${result.assessment}\n\n신뢰도: ${result.confidence}\n\n📋 치료 계획\n${result.treatmentPlan}`;
  card.classList.add('visible');
}

function addHistory(result, vitals) {
  const historyList = document.getElementById('historyList');
  const emptyEl = historyList.querySelector('.empty-history');
  if (emptyEl) emptyEl.remove();

  const color = result.painScore <= 3 ? 'var(--pain-low)' : result.painScore <= 6 ? 'var(--pain-mid)' : 'var(--pain-high)';
  const item = document.createElement('div');
  item.className = 'history-item';
  item.innerHTML = `
    <span style="color:${color}; font-size:16px; font-weight:500">${result.painScore}/10</span>
    <span style="color:var(--text-dim)">HR ${vitals.heartRate} · BP ${vitals.systolic}/${vitals.diastolic}</span>
    <span style="color:var(--text-dim)">${new Date().toLocaleTimeString('ko-KR')}</span>
  `;
  historyList.insertBefore(item, historyList.firstChild);
}
</script>
</body>
</html>
